name: Publish to NuGet

# Publishing is driven by a semver tag matching the version in Directory.Build.props: update
# <VersionPrefix> and CHANGELOG.md, commit, then push the tag (e.g. v1.0.0).
#
# Authentication is NuGet Trusted Publishing: the job exchanges GitHub's OIDC token for a
# short-lived API key, so no key is stored in this repository. The trust policy on nuget.org names
# this repository and this file, publish.yml — renaming the file breaks publishing.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write   # required to request the OIDC token

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The tag and the packages must carry the same version.
      - name: Check the tag against the version
        run: |
          version=$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VersionPrefix $version in Directory.Build.props."
            exit 1
          fi

      - name: Build
        run: dotnet build Stellaegis.Rendering.slnx -c Release

      # The PDF tests and the tests of Chromium's confinement need Playwright's Chromium. The
      # installation script is placed in the test project's output by the build above.
      - name: Install Chromium
        run: pwsh tests/Stellaegis.Rendering.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      # Chromium runs in its sandbox by default (PlaywrightRendererOptions.Sandbox), and Ubuntu 23.10+
      # forbids the unprivileged user namespaces the sandbox needs. The tests run the default, so the
      # runner allows them rather than the tests turning the sandbox off.
      - name: Allow Chromium's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Quality gate: the tests must pass before anything is pushed. Without Chromium the PDF tests
      # would be skipped, and a version would ship with the confinement unproven: a skipped test
      # fails the run.
      - name: Test
        run: dotnet test Stellaegis.Rendering.slnx -c Release --no-build -- xUnit.FailSkips=true

      - name: Pack
        run: dotnet pack Stellaegis.Rendering.slnx -c Release --no-build

      - name: Log in to NuGet
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      # Pushes every package, with its symbols. Already-published versions are skipped.
      - name: Push to NuGet
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
